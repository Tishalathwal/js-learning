<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <div class="parent">
        <div class="child">child 1</div>
        <div class="child">child 2</div>
        <div class="child">child 3</div>
    </div>
</body>
<script>
    // about children and parent element

    const parent = document.querySelector('.parent');
    // console.log(parent); // accessing the parent element
    // console.log(parent.children); // accessing the child elements of the parent
    // console.log(parent.children[1].innerHTML); // accessing the inner HTML of the second child element

    // console.log(parent.firstElementChild); // accessing the first child element of the parent
    // console.log(parent.lastElementChild); // accessing the last child element of the parent


    // we can also use for...of loop to access the child elements of the parent
     for (let i = 0; i < parent.children.length; i++) {
         console.log(parent.children[i].innerHTML);
        
    }
    

    const child = document.querySelector('.child');
    // console.log(child); // accessing the first child element
    // console.log(child.parentElement); // accessing the parent element of the child
    console.log(child.nextElementSibling); // accessing the next sibling element of the child
    console.log(child.previousElementSibling); // accessing the previous sibling element of the child
</script>
</html>
